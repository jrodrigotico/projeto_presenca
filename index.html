<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presença no escritório</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2250d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Presença">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e9eef7; --surface:#ffffff; --ink:#18213a; --muted:#66708a; --line:#d3dbea;
  --accent:#2250d8; --on-accent:#ffffff; --mark:#2250d8; --today:#f2b01e;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1526; --surface:#1a2238; --ink:#e8edf9; --muted:#97a2bf; --line:#2c3652;
    --accent:#6e95ff; --on-accent:#0f1526; --mark:#6e95ff; --today:#f2b01e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1526; --surface:#1a2238; --ink:#e8edf9; --muted:#97a2bf; --line:#2c3652;
  --accent:#6e95ff; --on-accent:#0f1526; --mark:#6e95ff; --today:#f2b01e; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:460px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.05rem;font-weight:600;margin:0 0 14px;color:var(--muted)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px;text-align:center}
.date{font-size:1.1rem;color:var(--muted);margin:0}
.clock{font-size:3.4rem;font-weight:800;letter-spacing:-.03em;margin:2px 0 16px;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--today);outline-offset:2px}
.big{width:100%;padding:18px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:1.2rem;font-weight:800}
.big.done{background:transparent;color:var(--ink);border:2px solid var(--accent)}
.undo{margin-top:10px;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.9rem}
.stats{display:flex;gap:10px;margin:16px 0}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:1.7rem;font-weight:800;line-height:1.1}
.stat span{font-size:.85rem;color:var(--muted)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav strong{font-size:1.1rem;text-transform:capitalize}
.nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:1.2rem}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{font-size:.78rem;color:var(--muted);padding:4px 0}
.d{aspect-ratio:1;border:0;border-radius:10px;background:none;color:var(--ink);font-size:.95rem;position:relative}
.d:disabled{opacity:.3;cursor:default}
.d.on{background:var(--mark);color:var(--on-accent);font-weight:800}
.d.today{box-shadow:inset 0 0 0 2px var(--today)}
.hint{font-size:.82rem;color:var(--muted);margin:10px 2px 0}
.list{list-style:none;margin:16px 0 0;padding:0}
.list li{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line)}
.list li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:10px 4px}
.backup{display:flex;gap:10px;margin-top:16px}
.backup button,.backup label{flex:1;text-align:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:.95rem}
.backup input{display:none}
.note{font-size:.82rem;color:var(--muted);margin:8px 2px 0}
@media (prefers-reduced-motion:no-preference){.big{transition:transform .1s}.big:active{transform:scale(.98)}}
</style>
</head>
<body>
<main>
  <h1>Presença no escritório</h1>

  <section class="hero" aria-live="polite">
    <p class="date" id="today-label"></p>
    <p class="clock" id="clock">--:--</p>
    <button class="big" id="mark">Marcar presença</button>
    <button class="undo" id="undo" hidden>Desfazer marcação de hoje</button>
  </section>

  <div class="stats">
    <div class="stat"><b id="s-month">0</b><span id="s-month-l">dias neste mês</span></div>
    <div class="stat"><b id="s-total">0</b><span>dias no total</span></div>
  </div>

  <section class="cal">
    <div class="nav">
      <button id="prev" aria-label="Mês anterior">‹</button>
      <strong id="month-label"></strong>
      <button id="next" aria-label="Próximo mês">›</button>
    </div>
    <div class="grid" id="grid"></div>
    <p class="hint">Esqueceu de marcar? Toque no dia para adicionar ou remover.</p>
    <ul class="list" id="list"></ul>
  </section>

  <div class="backup">
    <button id="export">Exportar backup</button>
    <label tabindex="0" id="import-l">Importar backup<input type="file" id="import" accept=".json,application/json"></label>
  </div>
  <p class="note" id="note">Seus registros ficam salvos só neste aparelho. Exporte um backup de vez em quando.</p>
</main>

<script>
(function(){
  var KEY = 'presenca-escritorio';
  var data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { data = {}; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }

  var now = new Date();
  var view = new Date(now.getFullYear(), now.getMonth(), 1);
  var $ = function(id){ return document.getElementById(id); };
  var pad = function(n){ return String(n).padStart(2, '0'); };
  var keyOf = function(y, m, d){ return y + '-' + pad(m + 1) + '-' + pad(d); };
  var todayKey = function(){ var t = new Date(); return keyOf(t.getFullYear(), t.getMonth(), t.getDate()); };
  var WD = ['dom','seg','ter','qua','qui','sex','sáb'];

  function tick(){
    var t = new Date();
    $('clock').textContent = pad(t.getHours()) + ':' + pad(t.getMinutes());
    $('today-label').textContent = t.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});
  }

  function render(){
    var tk = todayKey();
    var marked = !!data[tk];
    var btn = $('mark');
    btn.textContent = marked ? 'Presença marcada às ' + (data[tk] === '—' ? 'hoje' : data[tk]) : 'Marcar presença';
    btn.className = 'big' + (marked ? ' done' : '');
    btn.disabled = marked;
    $('undo').hidden = !marked;

    var y = view.getFullYear(), m = view.getMonth();
    $('month-label').textContent = view.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
    var first = new Date(y, m, 1).getDay();
    var days = new Date(y, m + 1, 0).getDate();
    var html = WD.map(function(w){ return '<div class="wd">' + w + '</div>'; }).join('');
    for (var i = 0; i < first; i++) html += '<div></div>';
    var count = 0, items = [];
    for (var d = 1; d <= days; d++) {
      var k = keyOf(y, m, d);
      var on = !!data[k];
      var future = new Date(y, m, d) > new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (on) { count++; items.push([d, k]); }
      html += '<button class="d' + (on ? ' on' : '') + (k === tk ? ' today' : '') + '" data-k="' + k + '"' +
              (future ? ' disabled' : '') + ' aria-pressed="' + on + '" aria-label="Dia ' + d + (on ? ', presente' : '') + '">' + d + '</button>';
    }
    $('grid').innerHTML = html;

    $('s-month').textContent = count;
    $('s-month-l').textContent = count === 1 ? 'dia neste mês' : 'dias neste mês';
    $('s-total').textContent = Object.keys(data).length;

    $('list').innerHTML = items.length ? items.reverse().map(function(it){
      var dt = new Date(y, m, it[0]);
      var w = dt.toLocaleDateString('pt-BR', {weekday:'long'});
      return '<li><span>' + pad(it[0]) + '/' + pad(m + 1) + ' · ' + w + '</span><span>' + (data[it[1]] === '—' ? 'sem horário' : data[it[1]]) + '</span></li>';
    }).join('') : '<li class="empty">Nenhuma presença neste mês.</li>';
  }

  $('mark').addEventListener('click', function(){
    var t = new Date();
    data[todayKey()] = pad(t.getHours()) + ':' + pad(t.getMinutes());
    save(); render();
  });
  $('undo').addEventListener('click', function(){ delete data[todayKey()]; save(); render(); });
  $('grid').addEventListener('click', function(e){
    var b = e.target.closest('.d'); if (!b || b.disabled) return;
    var k = b.getAttribute('data-k');
    if (data[k]) delete data[k]; else data[k] = '—';
    save(); render();
  });
  $('prev').addEventListener('click', function(){ view.setMonth(view.getMonth() - 1); render(); });
  $('next').addEventListener('click', function(){ view.setMonth(view.getMonth() + 1); render(); });

  function say(t){ $('note').textContent = t; }
  $('export').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'presenca-backup-' + todayKey() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    say('Backup exportado.');
  });
  $('import').addEventListener('change', function(e){
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      try {
        var obj = JSON.parse(r.result), n = 0;
        Object.keys(obj).forEach(function(k){
          if (/^\d{4}-\d{2}-\d{2}$/.test(k) && typeof obj[k] === 'string') { data[k] = obj[k]; n++; }
        });
        save(); render(); say(n + ' registros importados.');
      } catch (err) { say('Arquivo inválido. Escolha um backup exportado por este app.'); }
      e.target.value = '';
    };
    r.readAsText(f);
  });
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function(){}); }

  tick(); setInterval(tick, 20000); render();
})();
</script>
</body>
</html>
