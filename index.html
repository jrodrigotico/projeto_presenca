<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presença no escritório</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2250d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Presença">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e9eef7; --surface:#ffffff; --ink:#18213a; --muted:#66708a; --line:#d3dbea;
  --accent:#2250d8; --on-accent:#ffffff; --mark:#2250d8; --today:#f2b01e;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1526; --surface:#1a2238; --ink:#e8edf9; --muted:#97a2bf; --line:#2c3652;
    --accent:#6e95ff; --on-accent:#0f1526; --mark:#6e95ff; --today:#f2b01e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1526; --surface:#1a2238; --ink:#e8edf9; --muted:#97a2bf; --line:#2c3652;
  --accent:#6e95ff; --on-accent:#0f1526; --mark:#6e95ff; --today:#f2b01e; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:460px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.05rem;font-weight:600;margin:0 0 14px;color:var(--muted)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px;text-align:center}
.date{font-size:1.1rem;color:var(--muted);margin:0}
.clock{font-size:3.4rem;font-weight:800;letter-spacing:-.03em;margin:2px 0 16px;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--today);outline-offset:2px}
.big{width:100%;padding:18px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:1.2rem;font-weight:800}
.big.done{background:transparent;color:var(--ink);border:2px solid var(--accent)}
.undo{margin-top:10px;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.9rem}
.stats{display:flex;gap:10px;margin:16px 0}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:1.7rem;font-weight:800;line-height:1.1}
.stat span{font-size:.85rem;color:var(--muted)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav strong{font-size:1.1rem;text-transform:capitalize}
.nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:1.2rem}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{font-size:.78rem;color:var(--muted);padding:4px 0}
.d{aspect-ratio:1;border:0;border-radius:10px;background:none;color:var(--ink);font-size:.95rem;position:relative}
.d:disabled{opacity:.3;cursor:default}
.d.on{background:var(--mark);color:var(--on-accent);font-weight:800}
.d.today{box-shadow:inset 0 0 0 2px var(--today)}
.hint{font-size:.82rem;color:var(--muted);margin:10px 2px 0}
.list{list-style:none;margin:16px 0 0;padding:0}
.list li{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line)}
.list li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:10px 4px}
.backup{display:flex;gap:10px;margin-top:16px}
.backup button,.backup label{flex:1;text-align:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:.95rem}
.backup input{display:none}
.note{font-size:.82rem;color:var(--muted);margin:8px 2px 0}
.auth{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px}
.auth h2{margin:0 0 4px;font-size:1.3rem}
.auth p{margin:0 0 14px;color:var(--muted);font-size:.92rem}
.auth input{width:100%;padding:13px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
.auth .row{display:flex;gap:10px}
.auth .row button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--accent);background:none;color:var(--ink);font-weight:600}
.auth .row button.p{background:var(--accent);color:var(--on-accent)}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:-6px 0 14px;font-size:.85rem;color:var(--muted)}
.who button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem}
@media (prefers-reduced-motion:no-preference){.big{transition:transform .1s}.big:active{transform:scale(.98)}}
</style>
</head>
<body>
<main>
  <h1>Presença no escritório</h1>

  <section class="auth" id="auth" hidden>
    <h2>Entrar</h2>
    <p>Entre com o mesmo e-mail e senha nos seus aparelhos para ver os mesmos dias em todos.</p>
    <input id="email" type="email" autocomplete="email" placeholder="E-mail">
    <input id="pass" type="password" autocomplete="current-password" placeholder="Senha (mínimo 6 caracteres)">
    <div class="row"><button class="p" id="login">Entrar</button><button id="signup">Criar conta</button></div>
    <p id="auth-msg" style="margin:12px 0 0" role="status"></p>
  </section>

  <div id="app" hidden>
  <div class="who"><span id="who"></span><button id="logout">Sair</button></div>

  <section class="hero" aria-live="polite">
    <p class="date" id="today-label"></p>
    <p class="clock" id="clock">--:--</p>
    <button class="big" id="mark">Marcar presença</button>
    <button class="undo" id="undo" hidden>Desfazer marcação de hoje</button>
  </section>

  <div class="stats">
    <div class="stat"><b id="s-month">0</b><span id="s-month-l">dias neste mês</span></div>
    <div class="stat"><b id="s-total">0</b><span>dias no total</span></div>
  </div>

  <section class="cal">
    <div class="nav">
      <button id="prev" aria-label="Mês anterior">‹</button>
      <strong id="month-label"></strong>
      <button id="next" aria-label="Próximo mês">›</button>
    </div>
    <div class="grid" id="grid"></div>
    <p class="hint">Esqueceu de marcar? Toque no dia para adicionar ou remover.</p>
    <ul class="list" id="list"></ul>
  </section>

  <div class="backup">
    <button id="export">Exportar backup</button>
    <label tabindex="0" id="import-l">Importar backup<input type="file" id="import" accept=".json,application/json"></label>
  </div>
  <p class="note" id="note">Sincronizando...</p>
  </div>
</main>

<script>
(function(){
  var SB = 'https://kjluvuqaejncmgscqkli.supabase.co';
  var KEY = 'sb_publishable_TZcOHN35ZOGMfAze0Bhzog_zPuYnaCs';
  var SES = 'presenca-sessao', LEGACY = 'presenca-escritorio';
  var $ = function(id){ return document.getElementById(id); };
  var pad = function(n){ return String(n).padStart(2, '0'); };
  var keyOf = function(y, m, d){ return y + '-' + pad(m + 1) + '-' + pad(d); };
  var todayKey = function(){ var t = new Date(); return keyOf(t.getFullYear(), t.getMonth(), t.getDate()); };
  var WD = ['dom','seg','ter','qua','qui','sex','sáb'];
  var now = new Date();
  var view = new Date(now.getFullYear(), now.getMonth(), 1);
  var session = null, data = {}, pending = [];

  function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function say(t){ $('note').textContent = t; }
  function cacheKey(){ return 'presenca-' + session.user.id; }
  function saveCache(){ lsSet(cacheKey(), {data: data, pending: pending}); }

  /* ---------- Supabase (REST puro) ---------- */
  function authCall(path, body){
    return fetch(SB + '/auth/v1/' + path, {
      method: 'POST',
      headers: {'apikey': KEY, 'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    }).then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.msg || j.error_description || j.message || 'Erro'); return j; }); });
  }
  function setSession(j){
    session = {access_token: j.access_token, refresh_token: j.refresh_token,
               expires_at: j.expires_at || (Math.floor(Date.now()/1000) + (j.expires_in || 3600)),
               user: {id: j.user.id, email: j.user.email}};
    lsSet(SES, session);
  }
  function freshToken(){
    if (session.expires_at - 60 > Date.now()/1000) return Promise.resolve(session.access_token);
    return authCall('token?grant_type=refresh_token', {refresh_token: session.refresh_token})
      .then(function(j){ setSession(j); return session.access_token; });
  }
  function rest(path, opts){
    opts = opts || {};
    return freshToken().then(function(tok){
      var h = {'apikey': KEY, 'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json'};
      if (opts.prefer) h['Prefer'] = opts.prefer;
      return fetch(SB + '/rest/v1/' + path, {method: opts.method || 'GET', headers: h, body: opts.body});
    }).then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.status === 204 || r.status === 201 ? null : r.json();
    });
  }
  function upsert(rows){
    return rest('presencas', {method: 'POST', prefer: 'resolution=merge-duplicates,return=minimal',
                              body: JSON.stringify(rows)});
  }

  function sync(){
    if (!session) return Promise.resolve();
    return rest('presencas?select=dia,hora&order=dia.desc&limit=1000').then(function(rows){
      var server = {};
      rows.forEach(function(r){ server[r.dia] = r.hora || '—'; });
      var toPush = pending.filter(function(k){ return data[k]; }).map(function(k){ return {dia: k, hora: data[k]}; });
      var done = toPush.length ? upsert(toPush) : Promise.resolve();
      return done.then(function(){
        toPush.forEach(function(r){ server[r.dia] = r.hora; });
        data = server; pending = []; saveCache(); render();
        say('Sincronizado.');
      });
    }).catch(function(){ say('Sem conexão. Seus registros ficam salvos aqui e serão enviados depois.'); });
  }

  /* ---------- Marcações ---------- */
  function mark(k, hora){
    data[k] = hora;
    if (pending.indexOf(k) < 0) pending.push(k);
    saveCache(); render();
    upsert([{dia: k, hora: hora}]).then(function(){
      pending = pending.filter(function(x){ return x !== k; }); saveCache(); say('Salvo e sincronizado.');
    }).catch(function(){ say('Salvo no aparelho. Será enviado quando houver conexão.'); });
  }
  function unmark(k){
    rest('presencas?dia=eq.' + k, {method: 'DELETE', prefer: 'return=minimal'}).then(function(){
      delete data[k]; pending = pending.filter(function(x){ return x !== k; }); saveCache(); render(); say('Removido.');
    }).catch(function(){ say('Não foi possível remover sem conexão. Tente de novo online.'); });
  }

  /* ---------- Tela ---------- */
  function tick(){
    var t = new Date();
    $('clock').textContent = pad(t.getHours()) + ':' + pad(t.getMinutes());
    $('today-label').textContent = t.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});
  }
  function render(){
    var tk = todayKey(), marked = !!data[tk], btn = $('mark');
    btn.textContent = marked ? 'Presença marcada às ' + (data[tk] === '—' ? 'hoje' : data[tk]) : 'Marcar presença';
    btn.className = 'big' + (marked ? ' done' : '');
    btn.disabled = marked;
    $('undo').hidden = !marked;

    var y = view.getFullYear(), m = view.getMonth();
    $('month-label').textContent = view.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
    var first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
    var html = WD.map(function(w){ return '<div class="wd">' + w + '</div>'; }).join('');
    for (var i = 0; i < first; i++) html += '<div></div>';
    var count = 0, items = [];
    for (var d = 1; d <= days; d++) {
      var k = keyOf(y, m, d), on = !!data[k];
      var future = new Date(y, m, d) > new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (on) { count++; items.push([d, k]); }
      html += '<button class="d' + (on ? ' on' : '') + (k === tk ? ' today' : '') + '" data-k="' + k + '"' +
              (future ? ' disabled' : '') + ' aria-pressed="' + on + '" aria-label="Dia ' + d + (on ? ', presente' : '') + '">' + d + '</button>';
    }
    $('grid').innerHTML = html;
    $('s-month').textContent = count;
    $('s-month-l').textContent = count === 1 ? 'dia neste mês' : 'dias neste mês';
    $('s-total').textContent = Object.keys(data).length;
    $('list').innerHTML = items.length ? items.reverse().map(function(it){
      var w = new Date(y, m, it[0]).toLocaleDateString('pt-BR', {weekday:'long'});
      return '<li><span>' + pad(it[0]) + '/' + pad(m + 1) + ' · ' + w + '</span><span>' + (data[it[1]] === '—' ? 'sem horário' : data[it[1]]) + '</span></li>';
    }).join('') : '<li class="empty">Nenhuma presença neste mês.</li>';
  }

  function showApp(){
    var c = lsGet(cacheKey());
    if (c) { data = c.data || {}; pending = c.pending || []; }
    else { // primeiro acesso neste aparelho: aproveita registros da versão antiga
      var old = lsGet(LEGACY) || {};
      data = old; pending = Object.keys(old); saveCache();
    }
    $('auth').hidden = true; $('app').hidden = false;
    $('who').textContent = session.user.email;
    render(); say('Sincronizando...'); sync();
  }
  function showAuth(){ session = null; $('app').hidden = true; $('auth').hidden = false; }

  function enter(kind){
    var email = $('email').value.trim(), pass = $('pass').value, msg = $('auth-msg');
    if (!email || pass.length < 6) { msg.textContent = 'Informe o e-mail e uma senha de pelo menos 6 caracteres.'; return; }
    msg.textContent = 'Aguarde...';
    var p = kind === 'signup' ? authCall('signup', {email: email, password: pass})
                              : authCall('token?grant_type=password', {email: email, password: pass});
    p.then(function(j){
      if (j.access_token) { setSession(j); msg.textContent = ''; showApp(); }
      else msg.textContent = 'Conta criada. Abra o link enviado para o seu e-mail e depois toque em Entrar.';
    }).catch(function(e){
      msg.textContent = /Invalid login/i.test(e.message) ? 'E-mail ou senha incorretos.' : e.message;
    });
  }

  /* ---------- Eventos ---------- */
  $('login').addEventListener('click', function(){ enter('login'); });
  $('signup').addEventListener('click', function(){ enter('signup'); });
  $('logout').addEventListener('click', function(){ try { localStorage.removeItem(SES); } catch (e) {} showAuth(); });
  $('mark').addEventListener('click', function(){
    var t = new Date(); mark(todayKey(), pad(t.getHours()) + ':' + pad(t.getMinutes()));
  });
  $('undo').addEventListener('click', function(){ unmark(todayKey()); });
  $('grid').addEventListener('click', function(e){
    var b = e.target.closest('.d'); if (!b || b.disabled) return;
    var k = b.getAttribute('data-k');
    if (data[k]) unmark(k); else mark(k, '—');
  });
  $('prev').addEventListener('click', function(){ view.setMonth(view.getMonth() - 1); render(); });
  $('next').addEventListener('click', function(){ view.setMonth(view.getMonth() + 1); render(); });

  $('export').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'presenca-backup-' + todayKey() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    say('Backup exportado.');
  });
  $('import').addEventListener('change', function(e){
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      try {
        var obj = JSON.parse(r.result), rows = [];
        Object.keys(obj).forEach(function(k){
          if (/^\d{4}-\d{2}-\d{2}$/.test(k) && typeof obj[k] === 'string') { data[k] = obj[k]; rows.push({dia: k, hora: obj[k]}); if (pending.indexOf(k) < 0) pending.push(k); }
        });
        saveCache(); render(); say(rows.length + ' registros importados. Sincronizando...'); sync();
      } catch (err) { say('Arquivo inválido. Escolha um backup exportado por este app.'); }
      e.target.value = '';
    };
    r.readAsText(f);
  });
  window.addEventListener('online', sync);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) { tick(); sync(); } });
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function(){}); }

  tick(); setInterval(tick, 20000);
  var saved = lsGet(SES);
  if (saved && saved.user) { session = saved; showApp(); } else showAuth();
})();
</script>
</body>
</html>
